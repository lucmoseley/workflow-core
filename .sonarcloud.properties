# Rule classes triaged false belong in the project's own settings, not here:
# automatic analysis does not read sonar.issue.ignore.multicriteria from this
# file. These are the rows of Administration > General Settings > Analysis Scope
# > Issues > Ignore Issues on Multiple Criteria (#3797 applies them), each
# checked across every finding, not a sample, in #3579's triage comment:
#
# rule key                       path            #2188 triage line, then why
# javascript:S3403               **/*            "S3403 ×272": noUncheckedIndexedAccess types nearly all as able to hold the value; #3579 fixed the dead ones
# javascript:S2871               **/*            "S2871 ×136": code-unit order keeps generated files byte-stable
# typescript:S2871               **/*            "S2871 ×136": as above
# javascript:S4036               **/*            "S4036 ×56": PATH lookup of standard tools; test kits fake them on purpose
# typescript:S4036               **/*            "S4036 ×56": as above
# typescript:S2699               **/*.test.ts    "S2699 ×15": the tests assert through helpers
# pythonsecurity:S8707           **/*            "56 taint findings whose source is always argv"
# jssecurity:S8707               **/*            as above
# pythonsecurity:S8705           **/*            as above
# jssecurity:S8705               **/*            as above
# javascript:S9383               scripts/**/*.js first fired after #2188, so #3579's triage: runCheck's promise catches its own errors
sonar.sources=.
sonar.exclusions=scripts/**/*.test.ts,scripts/**/test_*.py
sonar.tests=.
sonar.test.inclusions=scripts/**/*.test.ts,scripts/**/test_*.py
sonar.python.version=3.12
