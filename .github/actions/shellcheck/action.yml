name: Install shellcheck
description: Puts the pinned shellcheck on $GITHUB_PATH.

# THE VERSION IS PINNED, not taken from the runner image (#124), so that
# `npm run check:sh` and CI run the same binary.
#
# PROSPECTIVE, NOT A FIX FOR AN OBSERVED DISAGREEMENT: #118 looked like one and
# was not (#124 ran both versions over that tree and they agree). The pin
# removes a variable; do not cite #118 as proof they differ.
#
# Taken from PyPI's shellcheck-py wheel, which ships koalaman's static
# release binary, installed hash-pinned as test-tools' ruff is, because
# koalaman's GitHub release host has failed for hours at a time (#4653). The
# pin sits here, not in requirements-dev.txt as ruff's does: shellcheck-py
# publishes no Linux aarch64 wheel, so `--only-binary :all:` would break that
# file's install on this machine. The hash is the manylinux x86_64 wheel's,
# from PyPI's shellcheck-py/<v>/json — re-take it on a bump, and bump
# ~/.local/bin's aarch64 binary in the same pass
# (docs/agents/rules/shellcheck-not-installed.txt owns the local side).
#
# Residual: the hash is PyPI's own, so trust rests on PyPI and the
# shellcheck-py repackager rather than on koalaman; nothing compares the
# wheel's binary with koalaman's tarball; and the pin installs on x86_64
# runners only.
#
# On `$GITHUB_PATH`, so every later step runs it: Vitest's adopter
# first-commit tests run the real pre-commit shellcheck gate, and under the
# image's 0.9.0 they went red on an info finding 0.11.0 does not raise (#1295).
# A failed install leaves the image's 0.9.0 on PATH.
runs:
  using: composite
  steps:
    - shell: bash
      env:
        SHELLCHECK_PY: shellcheck-py==0.11.0.1
        SHELLCHECK_PY_SHA256: 1b274df81de5b000ff78db433e7328b87e52e3c38481c60f8e488c3095beef05
      run: |
        echo "$SHELLCHECK_PY --hash=sha256:$SHELLCHECK_PY_SHA256" > "$RUNNER_TEMP/shellcheck.txt"
        python3 -m venv "$RUNNER_TEMP/shellcheck-venv"
        "$RUNNER_TEMP/shellcheck-venv/bin/pip" install --require-hashes --only-binary :all: \
          -r "$RUNNER_TEMP/shellcheck.txt"
        mkdir -p "$RUNNER_TEMP/shellcheck-bin"
        ln -s "$RUNNER_TEMP/shellcheck-venv/bin/shellcheck" "$RUNNER_TEMP/shellcheck-bin/shellcheck"
        "$RUNNER_TEMP/shellcheck-bin/shellcheck" --version
        echo "$RUNNER_TEMP/shellcheck-bin" >> "$GITHUB_PATH"
