name: Named rerun

# The queue lander's verdict on named test files no `lander/batch-<k>` run covers,
# an isolation commit's and `main`'s base check among them (#3764, #4458).
# `queueTester` (scripts/lib/actions-tester.js) fires it and finds its run by
# this title, as a dispatch's own head sha is the ref's, never the sha under
# test.
run-name: named-rerun ${{ inputs.sha }} ${{ inputs.nonce }}

on:
  workflow_dispatch:
    inputs:
      sha:
        required: true
        type: string
      files:
        description: "The test files, one a line."
        required: true
        type: string
      nonce:
        description: "Tells this dispatch's run from another's at the same sha."
        required: true
        type: string

permissions:
  contents: read

jobs:
  named:
    name: Named files
    if: ${{ github.repository == 'lucmoseley/workflow-core' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.sha }}
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        uses: ./.github/actions/node-deps

      - name: Write the husky shims
        run: npm run prepare

      - name: Install test tools
        uses: ./.github/actions/test-tools

      # arm-tasks.test.ts pushes HEAD's history. Through the environment, never
      # `${{ }}` in `run:`.
      - name: Full history
        env:
          SHA: ${{ inputs.sha }}
        run: git fetch --quiet --no-tags --unshallow origin "$SHA"

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        if: ${{ contains(inputs.files, '.py') }}
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install Python dependencies
        if: ${{ contains(inputs.files, '.py') }}
        run: python3 -m pip install --require-hashes --only-binary ":all:" -r requirements-dev.txt

      # Both runners run where the first fails, so a red names every failing
      # file.
      - name: Test
        env:
          FILES: ${{ inputs.files }}
        run: |
          mapfile -t files <<<"$FILES"
          vitest=()
          pytest=()
          for f in "${files[@]}"; do
            case "$f" in
            *.py) pytest+=("$f") ;;
            *) vitest+=("$f") ;;
            esac
          done
          status=0
          if [ "${#vitest[@]}" -gt 0 ]; then
            npm run test -- "${vitest[@]}" || status=$?
          fi
          if [ "${#pytest[@]}" -gt 0 ]; then
            node scripts/run-pytest.js "${pytest[@]}" || status=$?
          fi
          exit "$status"
