name: Landing quiet 14h

# A report that runs off the machine (#3964), beside main-lag.yml: a dead
# machine cannot say it is dead. Its red reaches the founder as one bot
# mention per stall, from the tracker's alarm-notice.yml running
# scripts/alarm-notice.js (#4939).
#
# Its own file because scheduled-checks.yml's red means a failed test.
#
# PLANNED ABSENCE: Actions tab > Landing quiet 14h > "..." > Disable workflow,
# and "Enable workflow" on return.
#
# TEST THE NOTICE: gh workflow run landing-quiet.yml -R lucmoseley/workflow-core -f force_failure=true,
# then gh workflow run alarm-notice.yml -R lucmoseley/workflow-core-tracker once it has failed,
# all before this alarm's next scheduled run, whose green would end the stall.
on:
  schedule:
    # Hourly because GitHub drops scheduled runs. Off minute 0, GitHub's named
    # high-load window.
    - cron: "17 * * * *"
  workflow_dispatch:
    inputs:
      force_failure:
        description: "Fail whatever the newest push's age, to test the founder's notice."
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  quiet:
    # The run page the notice links shows this name: it carries the first look.
    name: Landing pushed in the last 14 hours - if red, wsl --list --running on Windows, then memcheck
    if: ${{ github.repository == 'lucmoseley/workflow-core' }}
    runs-on: ubuntu-latest
    # A guess: one API read with retries.
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            .claude/workflow-core.json
            scripts/lib
          sparse-checkout-cone-mode: false
      - name: Read the age of the newest push
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          FORCE_FAILURE: ${{ inputs.force_failure }}
          # An untraced margin (#3964).
          QUIET_HOURS: 14
        # The push time, not the tip's commit date: a push of an older commit
        # moves the branch and must turn this green. curl for --retry-all-errors,
        # which `gh api` lacks; 3 retries is a guess.
        run: |
          if ! branch=$(node scripts/lib/landing-refs.js pushed-branch); then
            echo "::error title=Check broken, not a stall::Could not ask scripts/lib/landing-refs.js which branch sessions push to, its error above. The push age is unread: read git log, then this run's log."
            exit 1
          fi
          activity="$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/activity?ref=refs/heads/$branch&per_page=1"
          if ! pushed=$(curl -fsS --retry 3 --retry-all-errors -H "Authorization: Bearer $GH_TOKEN" "$activity" | jq -er '.[0].timestamp'); then
            echo "::error title=Check broken, not a stall::Could not read $branch's newest push from $activity. Its state is unknown: read git log origin/$branch, then this run's log."
            exit 1
          fi
          if [ "$FORCE_FAILURE" = true ]; then
            echo "::error title=Forced failure::This run tests the founder's notice route. Newest push to $branch: $pushed."
            exit 1
          fi
          age=$(( $(date +%s) - $(date -d "$pushed" +%s) ))
          echo "Newest push to $branch: $pushed, $(( age / 3600 )) h ago."
          if [ "$age" -ge $(( QUIET_HOURS * 3600 )) ]; then
            echo "::error title=Landing quiet::No push to $branch for $QUIET_HOURS hours or more. Look first at: wsl --list --running on Windows, then memcheck in WSL. Planned absence: disable this workflow from the Actions tab."
            exit 1
          fi
