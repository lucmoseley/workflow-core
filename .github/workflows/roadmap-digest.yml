name: roadmap-digest

# Twelve belt-and-braces guards over the roadmap's derived/dependent docs, the
# rules that govern them and the core's own code. None regenerates anything — all
# only verify what is in the tree at the moment the schedule runs.
#
# THE REPORT-ONLY CHECKS AND THE FIVE ISSUE-FILING REPORTERS LEFT THIS FILE at
# #1557: the daily repo-checks run (scripts/lib/repo-checks-registry.js) reads
# them from the session-start launcher, as it does in every adopter. What stays
# here gates — exits non-zero on a finding — and is the backstop for a commit
# landed with the hooks off, or reads the core's own code or release state. Two
# steps here only warn: scripts-typecheck always, and doc-map-markers on a dated
# flag between 14 and 30 days old.
#
#   version-match    — the digest (docs/roadmap-digest.md) is regenerated by the
#                      roadmap-edit skill alongside the roadmap HTML and committed
#                      together; this job fails if their version lines drift
#                      (i.e. only one of the pair was updated). ALSO in
#                      .husky/pre-commit (mantahostels#910), the first place it fires.
#   digest-render    — the digest's bytes are exactly what gen-roadmap-digest.js
#                      renders from the roadmap HTML at this commit, catching any
#                      hand-edit at all, not just a drifted version line. ALSO in
#                      .husky/pre-commit, which is the only other place it runs —
#                      this is the backstop for the two escapes that turn off
#                      every hook at once, `HUSKY=0` and
#                      `core.hooksPath` off `.husky/_` (mantahostels#2895). Local backstop:
#                      `npm run check:digest-render`.
#   roadmap-valid    — docs/reference-roadmap.html is structurally valid as it
#                      stands in the tree: card ids, states, kinds, areas,
#                      dependency ordering, callout-label length. ALSO in
#                      .husky/pre-commit (mantahostels#698), which is the primary gate and
#                      judges the staged blob against HEAD's (mantahostels#974).
#   doc-map-coverage — docs/doc-map.md assigns every document an authority class
#                      (who may edit it, by what route). This job fails if a
#                      tracked doc has no register entry, an entry points at a
#                      file that no longer exists, or the map's own header line
#                      misreports how many register entries, tracked files or
#                      question routes it holds. Runs on any change under the
#                      mapped scope, not just the roadmap trio — which is what
#                      catches a doc landing under a Section A wildcard, the one
#                      route that moves the file count without editing the map.
#                      §A's render agreement is judged here too, which is how a
#                      hand edit landed with the hooks off is caught (mantahostels#1852).
#   doc-map-markers  — the map raises ⚠ flags on propagation it deferred, in §B
#                      entries and on Section A register rows alike. A flag
#                      stating a date is an observation that can go stale, so it
#                      WARNs at 14 days and FAILs at 30; an undated one is a
#                      standing hazard nothing clears, and never gates. Re-dating
#                      is how a session re-confirms a flag whose fix is blocked.
#   guard-registry   — every parallel-safety rule between the guard-registry
#                      delimiters must state its backing, and an **Enforced**
#                      claim must name a guard that exists AND is wired. Fails
#                      on a stale claim, which mantahostels#102 ruled worse than no label.
#                      ALSO in .husky/pre-commit (mantahostels#910), as version-match is.
#   workflow-perms   — no workflow job reaches past the R1 cap on timer-triggered
#                      work (docs/agents/autonomy-ceiling.md, mantahostels#1209).
#   scripts-typecheck — how much of scripts/ is still outside the type checker,
#                      split into the mechanical implicit-`any` family and the
#                      residue needing judgement (mantahostels#1395). WARN, never gating: the
#                      count is standing repo state and the session reading it is
#                      not the one that can pay it down. The GATING half of the
#                      same script is the §N8 ratchet in .husky/pre-commit, which
#                      refuses a commit bringing a new unchecked file into the
#                      corpus and never runs here.
#   release-pin      — the tag .claude-plugin/marketplace.json pins resolves on
#                      the remote an adopter fetches from (#257). GATES. NOT a
#                      pre-commit gate, and could not be: release-plugin.js reads
#                      the bump from `HEAD:`, so the bump must be committed while
#                      its tag does not yet exist, and a commit gate would refuse
#                      every release's own bump commit (#260, which placed it
#                      here).
#   guard-tests      — no guard test lets a fail-open reach the live log.
#   git-fixture-identity — no raw git fixture commits without its own identity.
#   skill-frontmatter — every own skill's frontmatter parses under strict YAML.
#
# NOTHING HERE READS THE TRACKER (#1963). The citation-ceiling check, which
# did, left for the daily repo-checks run when the tracker became a private
# repo apart from this public one: a token minted here cannot read it.

# NO PUSH OR PULL_REQUEST TRIGGER, and no path filter left to write one against
# (mantahostels#906, mantahostels#910).
#
# The two steps below that GATE and that nothing local ran — digest-version and
# guard-registry — also run in .husky/pre-commit, firing before a commit rather
# than after a push. Price accepted at mantahostels#906: a
# `--no-verify` commit and an auto-resolving merge (which git runs no pre-commit
# hook for) escape both until the next run.
#
# `workflow_call`, not a schedule of its own: the schedule lives in
# .github/workflows/scheduled-checks.yml, which calls this file and ci.yml
# together.
on:
  workflow_call:
  workflow_dispatch:

# ONE JOB, TWELVE GUARD STEPS, NOT TWELVE JOBS. Splitting these into separate
# jobs billed a minute per job regardless of runtime (mantahostels#313).
#
# The property the split existed to protect — no guard masks another, each
# failure attributable on its own — is preserved by `if: ${{ !cancelled() }}` on
# every guard step: each runs regardless of what an earlier one returned, and the
# job still ends red if any gate failed. Do not re-split these into jobs to
# recover per-check status ticks; the step names carry the same information.
jobs:
  checks:
    name: Document guards
    # Runs only in the code repo, as scheduled-checks.yml says, so a hand-fire
    # on the private tracker skips.
    if: ${{ github.repository == 'lucmoseley/workflow-core' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      # fetch-depth: 0 because check-release-pin.js reads the local tag set,
      # which a shallow checkout leaves empty.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      # Ten of the twelve guards below are dependency-free node scripts, so
      # this job ran without an install until check-workflow-permissions.js
      # (mantahostels#1209) arrived requiring js-yaml by name, and
      # check-skill-frontmatter.js (#887) is the other that needs this step.
      # check-scripts-typecheck.js --full stopped spawning tsc when
      # mantahostels#1464 retired the burndown it was measuring.
      #
      # `if:` here, unlike ci.yml's install, because a failed install must not
      # skip the ten guards that need nothing from it. The job still ends red
      # — and that one goes BROKEN rather than green, so a skipped install cannot
      # read as a clean corpus.
      - name: Install dependencies
        if: ${{ !cancelled() }}
        run: npm ci

      - name: Check roadmap HTML and digest versions agree
        if: ${{ !cancelled() }}
        run: node scripts/check-digest-version.js

      # Not only a drifted version line, which is all the step above catches.
      - name: Check the digest is what the generator renders
        if: ${{ !cancelled() }}
        run: node scripts/check-digest-render.js

      # A gate. `--tree` judges the roadmap as it stands, with no baseline: a
      # validator ERROR fails this step, WARNINGs print and pass.
      #
      # .husky/pre-commit catches a break before the commit; this catches one
      # that arrived by a route the hook never saw, at a detection latency of up
      # to ~12 hours — the cron asks for 4, GitHub delivers late (mantahostels#2204). Local
      # backstop: `npm run check:roadmap:tree`.
      - name: Check the roadmap is structurally valid as it stands
        if: ${{ !cancelled() }}
        run: node scripts/check-roadmap-valid.js --tree

      - name: Check every document is registered and §A matches the generator
        if: ${{ !cancelled() }}
        run: node scripts/check-doc-map.js

      - name: Check no doc-map propagation flag has been left to go stale
        if: ${{ !cancelled() }}
        run: node scripts/check-doc-map-markers.js

      # Every scripts/ .js that has silenced the type checker with
      # `// @ts-nocheck`, and whether it said why (mantahostels#1464). --full adds each
      # file's size and its declared reason to the bare list the SessionStart
      # hook prints. WARN and never gates.
      - name: Report which scripts/ files have silenced the type checker
        if: ${{ !cancelled() }}
        run: node scripts/check-scripts-typecheck.js --full

      # A gate, not a report: the guard file is present and referenced, or it is
      # not.
      #
      # A hook file IS a guard: delete .husky/pre-commit and the shared-tree
      # branch claim in CLAUDE.md goes stale without any document changing. That
      # is why the pre-commit copy of this check (mantahostels#910) conditions on .husky/ as
      # well as on the documents.
      - name: Check every parallel-safety rule states a backing that holds
        if: ${{ !cancelled() }}
        run: node scripts/check-guard-registry.js

      # A gate, and the backstop for the pre-commit copy, which fires only on
      # commits staging a scripts/ test or shell file: this catches the pair that
      # arrives by two separate commits — a guard that starts logging, and a test
      # that already spawned it (mantahostels#1452).
      #
      # Local backstop: `npm run check:guard-tests`.
      - name: Check every guard test keeps its fail-opens out of the live log
        if: ${{ !cancelled() }}
        run: node scripts/check-guard-test-isolation.js

      # A regression of mantahostels#2310's shape: a scripts/ test that raw-inits and
      # raw-commits a git repo with no identity, green on every developer
      # machine's global identity and red on this runner, which carries none
      # (mantahostels#2355). Local backstop: `npm run check:git-fixture-identity`.
      - name: Check every raw git fixture commits with its own identity
        if: ${{ !cancelled() }}
        run: node scripts/check-git-fixture-identity.js

      # A gate. docs/agents/autonomy-ceiling.md caps TIMER-triggered work at R1 —
      # file or refresh an issue — so no job in .github/workflows/ may hold a
      # write scope beyond `issues: write`, and no step may commit or push. It
      # FAILS on zero jobs inspected (mantahostels#1209).
      #
      # Local backstop: `npm run check:workflow-perms`.
      - name: Check no workflow job reaches past the timer-triggered autonomy cap
        if: ${{ !cancelled() }}
        run: node scripts/check-workflow-permissions.js

      # A gate, and the sweep half of a pair: pre-commit runs it on --against
      # HEAD, which passes a fault HEAD already carries, so this is where an
      # inherited one fails (#887). Needs the install above, for js-yaml.
      - name: Check every own skill's frontmatter parses under strict YAML
        if: ${{ !cancelled() }}
        run: node scripts/check-skill-frontmatter.js

      # A gate, and the unattended half of a pair: release-plugin.js refuses a
      # cut the marketplace does not pin, and this refuses a pin no adopter can
      # fetch.
      #
      # WHY THIS JOB AND NOT A NEW ONE. Actions bills a one-minute minimum per
      # JOB, so a new one would cost ~4 billed min/day whatever it did; a step
      # here costs nothing, this job being ungated by scheduled-checks.yml's
      # skip gate and so already billed on every sweep (#260).
      #
      # THE TIMEOUT, NOT THE STEP'S OWN ~1.5s, IS WHAT CAN SPEND THE HEADROOM —
      # with no further step added. check-release-pin.js caps its one ls-remote
      # at LS_REMOTE_TIMEOUT_MS, 15s, so a remote that is SLOW rather than
      # unreachable makes this step ~15s and the job ~55s against a job last
      # measured at 40s worst (#260). A job crossing 60s bills a second minute,
      # ~4 more billed min/day.
      #
      # The only step here reaching a remote. `origin` is preferred over the
      # marketplace's bare URL so the checkout's own credentials carry it while
      # the repo is private.
      #
      # --require-remote MAKES AN UNREACHABLE REMOTE A FAULT HERE, where the
      # checker's default is SKIP, exit 0 (#263). A SKIP would leave this job
      # green with nothing printed anywhere a session reads, so a broken
      # credential or a broken URL match would report healthy forever — #257's
      # own harm returning. The price is a red sweep on a transient outage,
      # accepted at #263: a WARN would not reach a reader at all, nothing here
      # reading a green run's annotations, while a red is reported at the next
      # session start by check-ci-status.js --notify.
      #
      # DISTRUST A `TAG-UNCUT` FROM THIS STEP. The checker tells it from
      # `TAG-UNPUSHED` by the local tag set, and a runner's tags come from the
      # remote, so every remote-absent tag reads as uncut here and the printed
      # remedy is the one release-plugin.js refuses. #264 holds that.
      #
      # Local backstop: `npm run check:release-pin`.
      - name: Check the marketplace's pinned release tag is on the remote
        if: ${{ !cancelled() }}
        run: node scripts/check-release-pin.js --require-remote
