name: Queue ref waiting 2h

# The off-machine stall check (#4443, #4458): scripts/main-lag-alarm.js
# fails where the oldest queue ref has waited past its QUEUE_BACKSTOP_MS.
# Read-only: it reads refs and the activity feed.
# GitHub sends a scheduled run's failure to the user who last
# changed the cron or re-enabled this file.
#
# PLANNED ABSENCE: Actions tab > Queue ref waiting 2h > "..." > Disable
# workflow, and "Enable workflow" on return.
on:
  schedule:
    # Hourly because GitHub drops scheduled runs; off landing-quiet.yml's
    # minute and off minute 0, GitHub's named high-load window.
    - cron: "47 * * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lag:
    # This name and the workflow's are the part of the alarm an email carries.
    name: No queue ref waited over 2 hours - if red, read the queue ticket
    if: ${{ github.repository == 'lucmoseley/workflow-core' }}
    runs-on: ubuntu-latest
    # A guess: a checkout and one API read with retries, and one per queue
    # ref.
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            scripts/main-lag-alarm.js
            scripts/lib
          sparse-checkout-cone-mode: false
      - name: Read the oldest queue ref's wait
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/main-lag-alarm.js
