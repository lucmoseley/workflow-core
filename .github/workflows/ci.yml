name: CI

# NO TRIGGER OF ITS OWN BUT DISPATCH (mantahostels#906, mantahostels#910).
# .github/workflows/scheduled-checks.yml calls this file four times a day
# (mantahostels#3490) and on every push to `landing`, where the lander reads
# that run as its tester (#2413).
#
# It CALLS rather than holds the schedule because GitHub's idle auto-disable
# takes down a whole workflow FILE, `workflow_dispatch` included (mantahostels#909) — so a
# schedule here would put the manual escape hatch on the same fuse. Inside a
# called workflow `github.event_name` is the CALLER's event, so a step keyed on
# `schedule` still reads `schedule`.
#
# No `concurrency` / `cancel-in-progress` block. Do not add one: a group keeps
# one pending run and cancels the rest, so a `landing` tip pushed between two
# others would go untested and the lander would read no verdict at it.
#
# Run the suite by hand with `gh workflow run ci.yml` — ANY SESSION may: this
# repo's PAT holds `Actions: Read and write` (mantahostels#1069). It spends a
# unit of the 3-a-day sweep budget, the same one scheduled-checks.yml spends
# (`scripts/lib/sweep-fire.js`, mantahostels#3514). Spending nothing? `npm run check:ci`
# reads the last sweep instead.
on:
  workflow_call:
  workflow_dispatch:

# Declared, not inherited. With no block at all these jobs run on the
# REPOSITORY's default token, which is read-write on a repo nobody has narrowed
# — and that default is unreadable from an agent session (the PAT answers 403 on
# actions/permissions/workflow), so silence here could not even be checked.
# contents: read is all the checkout needs, and no step here calls `gh` or the
# API (mantahostels#1209).
permissions:
  contents: read

# Lint and Vitest are separate jobs, and Vitest a matrix of `--shard` jobs, so
# a verdict lands in under 3 min once its jobs start (#2413, on the founder's
# target captured at #2729). Minutes are free on the public repo (#1930), so
# the repeated checkout and `npm ci` cost wall time only, inside each job.
#
# Within the lint job `if: ${{ !cancelled() }}` runs each step regardless of
# what the one before it returned, so no failure masks another.
#
# These jobs are what actually guard the roadmap-edit scripts. The pre-commit
# hook runs `npm run check:staged` (Biome over the commit's own paths only,
# mantahostels#179) and the roadmap/digest pair guard,
# but not the tests — and any hook is one `--no-verify` away from being absent,
# so nothing outside a local run would exercise validate.js at all. The
# `node_modules/.bin/biome ci .` step below is the only whole-repo Biome that
# runs automatically; `npm run check` is the same scan by hand, before a push.
#
# Unfiltered: every scheduled run does the whole job. The document guards live in
# the roadmap-digest workflow, which the same schedule calls and which is not
# path-filtered either; nor are the tests, because they cover code that a change
# anywhere can break.
jobs:
  # Every job runs only in the code repo, as scheduled-checks.yml says, so a
  # `gh workflow run ci.yml` that reaches the private tracker bills nothing
  # (#1963).
  lint:
    name: Lint and types
    if: ${{ github.repository == 'lucmoseley/workflow-core' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      # No `if:` here deliberately: nothing downstream can run without the
      # dependencies, so a failed install should stop the job.
      # `--ignore-scripts` on every install here, as guard-npm-install holds
      # local ones to: a dependency's install script would run with this job's
      # token before anything has read it (#3363). A dependency that needs its
      # script gets an `npm rebuild <pkg>` after the install, naming it.
      - name: Install dependencies
        run: npm ci --ignore-scripts

      # By path, never `npx biome`: the bare name is an unrelated package that
      # exits 0 having checked nothing (mantahostels#1538). `if: !cancelled()` runs this step
      # even when `npm ci` above failed — exactly when node_modules is absent.
      # scripts/npx-bare-name.test.ts holds the whole repo to this.
      - name: Biome ci
        if: ${{ !cancelled() }}
        run: node_modules/.bin/biome ci . --error-on-warnings

      # ESLint, hard-failing (mantahostels#1133). Biome does NOT subsume it: Biome 2.5's react
      # and next rule domains already own useHookAtTopLevel and
      # useExhaustiveDependencies, but nothing in Biome fires on a synchronous
      # <script>, a hand-written stylesheet <link>, or the other 20 @next/next
      # framework rules.
      #
      # .husky/pre-commit runs the same rules on the commit's own staged paths,
      # and hard-fails too. Do not soften either to match the other.
      - name: ESLint
        if: ${{ !cancelled() }}
        run: npm run check:eslint

      # The guard scripts under scripts/ are shell, which Biome does not read at
      # all, yet they enforce the commit, branch, pull and issue rules. A broken
      # guard fails OPEN (it allows the command it should have denied), so its
      # breakage is silent by construction. The binary is the pinned one
      # .github/actions/shellcheck installs.
      - name: Install shellcheck
        if: ${{ !cancelled() }}
        uses: ./.github/actions/shellcheck

      - name: Shellcheck
        if: ${{ !cancelled() }}
        run: npm run check:sh

      # shfmt over the same file set (#1332). No fetch: the WASM build is a
      # pinned devDependency, so `Install dependencies` above supplied it.
      - name: shfmt
        if: ${{ !cancelled() }}
        run: npm run check:sh:format

      # Only actionlint lints the files in this directory: Biome parses no YAML,
      # and check:sh's file set is shell files alone, so the shell inside their
      # `run:` blocks has no other check (mantahostels#1137). actionlint shells out
      # to shellcheck for those blocks — the pinned one the Shellcheck step put
      # on `$GITHUB_PATH` ahead of the image's 0.9.0 — and catches an undefined
      # `needs:`, a bad `if:` expression and an unknown runner label besides.
      #
      # There is no npm route — the npm package called `actionlint` is an
      # unrelated third-party WASM wrapper abandoned in 2022 — so the binary is
      # fetched here. Pinned to a version AND a checksum: an unpinned
      # `curl … | bash` installer would make every scheduled run trust whatever
      # is published at that URL today. Bump the version and the sha256
      # together, from the release's own actionlint_<v>_checksums.txt.
      #
      # Runs `npm run check:actions` rather than the binary directly so CI and
      # the local by-hand route are one command; the pre-commit half passes the
      # commit's own staged workflow paths instead, and warns-and-passes when
      # the binary is absent. Do not soften this one to match it — a runner that
      # cannot fetch the tarball should fail loudly, not skip. The retries are
      # transport-level only (the incident behind them: mantahostels#1137):
      # the checksum below still decides what the retried bytes may be.
      - name: actionlint
        if: ${{ !cancelled() }}
        env:
          ACTIONLINT_VERSION: 1.7.12
          ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
        run: |
          tgz="$RUNNER_TEMP/actionlint.tgz"
          curl -sSfL --retry 3 --retry-all-errors --retry-delay 5 -o "$tgz" \
            "https://github.com/rhysd/actionlint/releases/download/v$ACTIONLINT_VERSION/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          echo "$ACTIONLINT_SHA256  $tgz" | sha256sum -c -
          tar -xzf "$tgz" -C "$RUNNER_TEMP" actionlint
          PATH="$RUNNER_TEMP:$PATH" npm run check:actions

      # tsc is the only thing that type-checks this repo IN CI: Biome does not
      # and ESLint does not (mantahostels#1062).
      #
      # `next build` DOES run, just not here — Vercel runs one on every push to
      # `main` and deploys it, so a type error can fail production before this
      # step ever runs (mantahostels#1464). Vercel type-checks tsconfig.build.json
      # (tsconfig.json minus scripts/ and .claude/); this step still reads the
      # full tsconfig.json, so the scripts are checked here and nowhere else.
      #
      # Hard-fails, deliberately. Its local counterpart in .husky/pre-commit only
      # warns, because that one reads the shared WORKTREE and would otherwise
      # refuse a commit over a parallel session's half-written file. A runner
      # checks out a clean tree, so here it can be strict. Do not soften this to
      # match the hook.
      #
      # Except the mods: their three passes (both mods and hooks/register.ts)
      # SKIP here with a warning, since the runner has no Claude Code
      # declarations to type them against and the repo may not carry them
      # (#1960). The Mod tests step below runs their tests, which type nothing.
      - name: Typecheck
        if: ${{ !cancelled() }}
        run: npm run typecheck

      # The brand sheet's §11 banned tells, over every tracked copy string
      # under app/ (mantahostels#858). The pre-commit hook checks only the commit's own
      # staged paths, so this is where a tell that reached main in a file nobody
      # has touched since is caught.
      - name: Website copy
        if: ${{ !cancelled() }}
        run: npm run check:copy

      # Is every helper-surface export the last release promised still listed
      # (#463)? The checkout carries no tags, and with none the checker SKIPs as
      # if nothing were released, so they are fetched first — depth 1, each
      # release commit being a root. In this job, so no Vitest shard sees the tags.
      - name: Surface contract
        if: ${{ !cancelled() }}
        run: |
          git fetch --no-tags --depth=1 origin '+refs/tags/v*:refs/tags/v*'
          node scripts/check-surface-contract.js

      # The mods' `claude plugin test`, on every mod in run-mod-tests.js's MODS
      # (#1854). `.husky/pre-push` runs them too, but a `--no-verify` push or one
      # from a machine with no `claude` skips them. A fresh runner needs no
      # login or key (#1813).
      #
      # `latest`, UNPINNED, unlike the binaries above: adopters update Claude
      # Code on their own schedule and the mod API changes between releases
      # (#828). The version is printed
      # first, and a failure names it again, because a red a release caused
      # carries no culprit commit. The README floor is read all the same; on
      # `latest` it can fail only where a README names a release not yet out.
      #
      # LAST, AND OFF `$GITHUB_PATH`, so no earlier step ever sees a `claude`.
      # A release breaking a mod on a sha already green surfaces at the next
      # sweep (scheduled-checks.yml).
      #
      # Not install.sh, which checks the binary only against a manifest from
      # the same host and runs a bootstrap binary of its own. The manifest's
      # detached signature is checked instead, against the release key's
      # fingerprint pinned here (code.claude.com/docs/en/setup, "Binary
      # integrity and code signing"), and the binary against that manifest's
      # sha256 (#3363).
      - name: Mod tests
        if: ${{ !cancelled() }}
        env:
          CLAUDE_RELEASES: https://downloads.claude.ai/claude-code-releases
          CLAUDE_SIGNER_FPR: 31DDDE24DDFAB679F42D7BD2BAA929FF1A7ECACE
          CLAUDE_PLATFORM: linux-x64
        run: |
          fetch() { curl --proto '=https' --tlsv1.2 -fsSL --retry 3 --retry-all-errors --retry-delay 5 "$@"; }
          dir="$RUNNER_TEMP/claude"
          mkdir -p "$dir"
          version=$(fetch "$CLAUDE_RELEASES/latest")
          fetch -o "$dir/manifest.json" "$CLAUDE_RELEASES/$version/manifest.json"
          fetch -o "$dir/manifest.json.sig" "$CLAUDE_RELEASES/$version/manifest.json.sig"
          fetch -o "$dir/key.asc" https://downloads.claude.ai/keys/claude-code.asc
          export GNUPGHOME="$dir/gnupg"
          mkdir -m 700 "$GNUPGHOME"
          gpg --batch --quiet --import "$dir/key.asc"
          gpg --batch --status-fd 1 --verify "$dir/manifest.json.sig" "$dir/manifest.json" > "$dir/gpg-status"
          grep -q "^\[GNUPG:\] GOODSIG " "$dir/gpg-status"
          grep -q "^\[GNUPG:\] VALIDSIG $CLAUDE_SIGNER_FPR " "$dir/gpg-status"
          fetch -o "$dir/claude" "$CLAUDE_RELEASES/$version/$CLAUDE_PLATFORM/claude"
          echo "$(jq -r --arg p "$CLAUDE_PLATFORM" '.platforms[$p].checksum' "$dir/manifest.json")  $dir/claude" | sha256sum -c -
          chmod +x "$dir/claude"
          "$dir/claude" --version
          WFC_CLAUDE_BIN="$dir/claude" node scripts/run-mod-tests.js --all

  # One job per shard; the matrix's length is the shard count, read back
  # through `strategy`. Sized on the unsharded step's 449 s (#2413) so each
  # shard's job, setup included, stays under 180 s. Shards are packed by
  # recorded file times, not file count (scripts/vitest-shard-sequencer.ts).
  # A batch is green only where every shard is.
  vitest:
    name: Vitest (${{ matrix.shard }}/${{ strategy.job-total }})
    if: ${{ github.repository == 'lucmoseley/workflow-core' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6, 7, 8]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      # The repo's own `prepare` runs, as `--ignore-scripts` skipped it: the
      # hook-gate tests copy the .husky/_ shims husky writes.
      - name: Install dependencies
        run: |
          npm ci --ignore-scripts
          npm run prepare

      - name: Install shellcheck
        if: ${{ !cancelled() }}
        uses: ./.github/actions/shellcheck

      # The Vitest step's gitleaks cases — init-adopter's first-commit acceptance
      # tests and the hook gates' real-secret cases — skip where `gitleaks` is
      # not on PATH, and ubuntu-latest ships none (#55). `!cancelled()` like
      # Vitest's own: without it an earlier step's failure skips this install
      # while Vitest still runs, and those cases skip green. Pinned by version
      # and checksum on the actionlint step's terms; 8.30.1 is also the version
      # the test fixtures' allowlisted-key comments name. Bump the version and
      # the sha256 together, from the release's gitleaks_<v>_checksums.txt.
      - name: Install gitleaks
        if: ${{ !cancelled() }}
        env:
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          tgz="$RUNNER_TEMP/gitleaks.tgz"
          curl -sSfL --retry 3 --retry-all-errors --retry-delay 5 -o "$tgz" \
            "https://github.com/gitleaks/gitleaks/releases/download/v$GITLEAKS_VERSION/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "$GITLEAKS_SHA256  $tgz" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/gitleaks-bin"
          tar -xzf "$tgz" -C "$RUNNER_TEMP/gitleaks-bin" gitleaks
          "$RUNNER_TEMP/gitleaks-bin/gitleaks" version
          echo "$RUNNER_TEMP/gitleaks-bin" >> "$GITHUB_PATH"

      # The adopter first-commit tests stage the skeleton's browse.py, and the
      # pre-commit format gate refuses a staged .py path where ruff is absent
      # (#1463, #1590). The pin and its hashes are read from
      # requirements-dev.txt, which formatters.test.ts holds the gate's own
      # install line to, so a bump there moves both. A venv of its own because
      # the image's system pip is externally managed (PEP 668), and only the
      # binary goes on PATH, so no later step meets the venv's python (#3363).
      - name: Install ruff
        if: ${{ !cancelled() }}
        run: |
          awk '/^ruff==/ { on = 1 } on { print } on && !/\\$/ { exit }' \
            requirements-dev.txt > "$RUNNER_TEMP/ruff.txt"
          grep -q '^ruff==' "$RUNNER_TEMP/ruff.txt"
          python3 -m venv "$RUNNER_TEMP/ruff-venv"
          "$RUNNER_TEMP/ruff-venv/bin/pip" install --require-hashes --only-binary :all: \
            -r "$RUNNER_TEMP/ruff.txt"
          mkdir -p "$RUNNER_TEMP/ruff-bin"
          ln -s "$RUNNER_TEMP/ruff-venv/bin/ruff" "$RUNNER_TEMP/ruff-bin/ruff"
          "$RUNNER_TEMP/ruff-bin/ruff" --version
          echo "$RUNNER_TEMP/ruff-bin" >> "$GITHUB_PATH"

      # The checkout is depth 1, and arm-tasks.test.ts pushes HEAD's history
      # to a sandbox origin, refused without the parents (#2099). Unshallowed here rather than `fetch-depth: 0`, which
      # would also fetch the tags Surface contract keeps from every test.
      - name: Full history
        if: ${{ !cancelled() }}
        run: git fetch --quiet --no-tags --unshallow origin "$GITHUB_SHA"

      # The guard port programme reads the Vitest step's time with load1 and
      # `free -m` beside it (#2733, #2783); the runner records neither otherwise.
      - name: Runner load and memory
        if: ${{ !cancelled() }}
        run: |
          cat /proc/loadavg
          free -m
          nproc

      # vitest run exits non-zero on any failing test and npm propagates that.
      # No continue-on-error, no `|| true` — a failing test fails the build.
      # Keep it that way.
      #
      # `--full` IS LOAD-BEARING: bare `npm run test` narrows to the diff
      # against merge-base(HEAD, <the pushed ref>) (mantahostels#3208, #2408). On a CI
      # checkout that base IS HEAD over a clean tree — and where the remote ref
      # is absent the fallback base is HEAD too — so the narrowed selection is
      # EMPTY and the wrapper exits 0 having run no test at all.
      # Worse than empty, it is UNSTABLE: the narrowed default escalates to the
      # whole suite by itself on a stale read-graph manifest, so without the
      # flag this step tests everything or nothing depending on that file.
      #
      # WFC_VITEST_JSON adds vitest's JSON report, uploaded below: the per-file
      # times docs/data/ci-shard-timings.csv is refreshed from, which
      # vitest-shard-sequencer.ts packs the shards by (#2413).
      - name: Vitest
        if: ${{ !cancelled() }}
        env:
          WFC_VITEST_JSON: ${{ runner.temp }}/vitest-${{ matrix.shard }}.json
        run: npm run test -- --full=coverage --shard=${{ matrix.shard }}/${{ strategy.job-total }}

      - name: Upload Vitest report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: vitest-report-${{ matrix.shard }}
          path: ${{ runner.temp }}/vitest-${{ matrix.shard }}.json
          if-no-files-found: warn
          retention-days: 14


  # A separate job, unlike Biome above: Python needs its own interpreter and pip
  # cache, not the Node setup, so folding it in would buy no shared steps — only
  # a serialised run of two suites that have nothing in common. `needs:` nothing,
  # so the two jobs run in parallel and each failure is attributable.
  #
  # What this actually guards is the evidence pipeline behind the partner analysis —
  # `evidence-audit.py` and `collect-evidence.py`, whose figures mantahostels'
  # doc-map publishes as its evidence-audit chain. test_doc_map_b7.py re-derives every published figure from the
  # committed evidence-audit.csv and the script's own constants.
  #
  # The corpus test (test_evidence_corpus.py) SKIPS here and that is correct, not a
  # gap to close: data/ is gitignored, so the 229-property scrape it runs over is not
  # in the repo. Do not commit the corpus to make it run — the committed CSV is that
  # run's row-level output and is what the CI-side test checks.
  python:
    name: Python
    if: ${{ github.repository == 'lucmoseley/workflow-core' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 3.12 matches the local interpreter on the dev machine. Pinned rather than
      # floating on `3.x`: a runner silently moving to a newer minor is a change to
      # what the pipeline was tested against, and should be a deliberate edit here.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          # setup-python's pip cache looks for requirements.txt by default and this
          # repo has no such file, so the path is named explicitly. Without it the
          # cache silently does nothing.
          cache-dependency-path: requirements-dev.txt

      # Hash-checking mode, which the hashes in requirements-dev.txt switch on
      # by themselves; the flag makes a hashless file fail rather than install
      # unchecked. Wheels only, so no sdist's build script runs here.
      - name: Install dependencies
        run: python3 -m pip install --require-hashes --only-binary ":all:" -r requirements-dev.txt

      # ruff, hard-failing (mantahostels#1135): pytest only ever imports what a test
      # imports, so a module no test reaches is never run, only read statically.
      #
      # A step in this job rather than a job of its own: the pip install this
      # needs has already run above. No install step for the same reason —
      # ruff is pinned in requirements-dev.txt, so `Install dependencies` above already fetched it.
      #
      # Hard-fails, unlike the .husky/pre-commit half, which warns and passes when
      # ruff is absent only because this step runs `ruff check`: remove it and
      # the hook refuses such a commit instead (#1563). A runner that has run
      # the pip install has ruff, so here a missing binary is a real breakage.
      # Do not soften this to match the hook.
      - name: Ruff
        if: ${{ !cancelled() }}
        run: npm run check:py

      # pytest exits non-zero on any failing test. As above, and with no `if:` —
      # a failing test fails the build. Keep it that way.
      # Collection is pinned to scripts/ by pytest.ini. Invoked through npm rather
      # than pytest directly so CI exercises the same one command a local run uses —
      # no setup-node step is needed for it: the runner ships node and npm, and
      # `run-pytest.js` reads nothing out of node_modules. `--full`, since a bare
      # run in a clean checkout selects no touched test (#3508).
      - name: Pytest
        run: npm run test:py -- --full

      # Base §N5 over every program-routed .py, through the pre-commit gate's
      # own walk and routing (#1830). Node is preinstalled on the runner, and
      # the checker needs no npm dependency.
      - name: Swallowed errors
        if: ${{ !cancelled() }}
        run: node scripts/check-swallowed-errors.js --all
